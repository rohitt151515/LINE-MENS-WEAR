let P=[];

async function loadStoreProducts(){
  try{
    const {createClient}=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    const supabase=createClient(
      "https://vhlgcahmnjmvuosocxfq.supabase.co",
      "sb_publishable_6KNl5AhaCYKdmpvP8plFDw_-po1otqH"
    );
    const {data,error}=await supabase.from("products")
      .select("id,name,description,category,price,image_url,sizes,colors,size_stock,stock,is_active,created_at")
      .eq("is_active",true)
      .order("created_at",{ascending:false});
    if(error) throw error;
    P=(data||[]).map(row=>{
      const sizeStock=(row.size_stock&&typeof row.size_stock==="object")?row.size_stock:{};
      const sizes=Array.isArray(row.sizes)?row.sizes:[];
      const stock={};
      sizes.forEach(size=>stock[size]=Math.max(0,Number(sizeStock[size]||0)));
      const colors=Array.isArray(row.colors)?row.colors:[];
      const fallbackColor=colors[0]||"Grey";
      const created=Date.parse(row.created_at||"")||0;
      return {
        id:String(row.id),slug:String(row.id),name:row.name||"Product",
        cat:row.category||"Other",price:Number(row.price)||0,sale:0,
        colors,sizes,stock,isNew:created>0&&(Date.now()-created)<30*24*60*60*1000,
        pop:100,desc:row.description||"",imgs:[row.image_url||img(fallbackColor,0)],
        createdAt:created
      };
    });
    cart=cart.filter(item=>P.some(product=>product.id===String(item.id)));
    wish=wish.filter(id=>P.some(product=>product.id===String(id)));
    sv("lmw_cart",cart);sv("lmw_wish",wish);
  }catch(error){
    console.error("Could not load products from Supabase:",error);
    productsError=error.message||"Could not connect to the product database.";
  }finally{
    productsLoading=false;
    route();
  }
}

function ship(sub,mode){return mode=="pickup"||sub==0||sub>=CONFIG.freeShipOver?0:CONFIG.shipFee}
function cartSub(){return cart.reduce((a,i)=>{const p=P.find(x=>x.id==i.id);return p?a+price(p)*i.qty:a},0)}
function shopList(list){const f=document.getElementById("res");f.innerHTML=list.length?list.map(card).join(""):`<p>${t("empty")}</p>`}
/* ===== Pages ===== */
const pages={
home(){const f=[...P].sort((a,b)=>b.pop-a.pop);return `<section class="hero" style="margin:0 -20px 0;padding-left:20px;padding-right:20px"><div class="w"><h1>${t("hero")}</h1><p>${t("herop")}</p><a class="btn" href="#shop">${t("shopnow")}</a></div></section>
<h2>${t("cats")}</h2><div class="cats">${[...new Set(P.map(p=>p.cat))].map(c=>`<a href="#shop" onclick="F.cat='${c}'">${c}</a>`).join("")}</div>
<h2>${t("feat")}</h2><div class="grid">${f.slice(0,4).map(card).join("")}</div>
<h2>${t("newa")}</h2><div class="grid">${P.filter(p=>p.isNew).slice(0,4).map(card).join("")}</div>
<h2>${t("best")}</h2><div class="grid">${f.slice(4,8).map(card).join("")}</div>
<h2>Special offers <span class="ph">(placeholder)</span></h2><div class="note">Sample: 15% off selected shirts. Real offers will be set by the owner.</div>
<h2>${t("about")}</h2><p style="max-width:620px">Placeholder brand story. Replace with the real LINE MENS WEAR story.</p>
<h2>${t("news")}</h2><form class="f" onsubmit="event.preventDefault();toast('Newsletter needs the backend. Not saved yet.')" style="display:flex;gap:8px;max-width:420px"><input type="email" required placeholder="${t("email")}" aria-label="${t("email")}"><button class="btn">OK</button></form>`},
shop(mode){let l=P.filter(p=>(!F.cat||p.cat==F.cat)&&(!F.size||p.stock[F.size]>0)&&(!F.color||p.colors.includes(F.color))&&(!F.max||price(p)<=+F.max)&&(!F.q||p.name.toLowerCase().includes(F.q.toLowerCase()))&&(mode!="new"||p.isNew)&&(mode!="best"||p.pop>=60));
l.sort((a,b)=>F.sort=="new"?(b.isNew-a.isNew):F.sort=="lo"?price(a)-price(b):F.sort=="hi"?price(b)-price(a):b.pop-a.pop);
const o=(arr,v)=>arr.map(x=>`<option ${x==v?"selected":""} value="${x}">${x}</option>`).join("");
return `<h2>${mode=="new"?t("newa"):mode=="best"?t("best"):t("shop")}</h2><div class="layout"><aside class="fl"><h3>${t("filters")}</h3>
<label>${t("cats")}</label><select onchange="F.cat=this.value;route()"><option value="">${t("all")}</option>${o([...new Set(P.map(p=>p.cat))],F.cat)}</select>
<label>${t("size")}</label><select onchange="F.size=this.value;route()"><option value="">${t("all")}</option>${o(["S","M","L","XL","XXL"],F.size)}</select>
<label>${t("color")}</label><select onchange="F.color=this.value;route()"><option value="">${t("all")}</option>${o(Object.keys(COL),F.color)}</select>
<label>${t("maxp")}</label><input type="number" min="0" step="100" value="${F.max}" onchange="F.max=this.value;route()">
<label>${t("sort")}</label><select onchange="F.sort=this.value;route()"><option value="pop" ${F.sort=="pop"?"selected":""}>${t("pop")}</option><option value="new" ${F.sort=="new"?"selected":""}>${t("neww")}</option><option value="lo" ${F.sort=="lo"?"selected":""}>${CONFIG.currency} ↑</option><option value="hi" ${F.sort=="hi"?"selected":""}>${CONFIG.currency} ↓</option></select></aside>
<div class="grid" id="res">${l.length?l.map(card).join(""):`<p>${t("empty")}</p>`}</div></div>`},
categories(){return `<h2>${t("cats")}</h2><div class="cats">${[...new Set(P.map(p=>p.cat))].map(c=>`<a href="#shop" onclick="F.cat='${c}'">${c}</a>`).join("")}</div>`},
product(id){const p=P.find(x=>x.id==id);if(!p)return `<h2>404</h2><a href="#shop">${t("shop")}</a>`;const s=window.sel&&window.sel.id==id?window.sel:(window.sel={id,size:"",color:p.colors[0],img:0});
const tot=Object.values(p.stock).reduce((a,b)=>a+b,0);
return `<div class="pd" style="margin-top:30px"><div><img class="main" src="${p.imgs[s.img]}" alt="${esc(p.name)}"><div class="th">${p.imgs.map((m,i)=>`<img class="${i==s.img?"on":""}" src="${m}" alt="" onclick="sel.img=${i};route()">`).join("")}</div></div>
<div><h1 style="font-weight:500;margin:0">${esc(p.name)}</h1><p class="ph">${p.cat}</p><p style="font-size:24px;margin:4px 0">${money(price(p))}${p.sale?` <s style="font-size:16px;color:var(--mut)">${money(p.price)}</s>`:""}</p>
<p>${p.desc}</p><p>${tot?t("instock"):t("out")}</p>
<b>${t("size")}</b><div class="chips">${p.sizes.map(z=>`<button class="chip ${s.size==z?"on":""}" ${p.stock[z]?"":"disabled"} onclick="sel.size='${z}';route()">${z}</button>`).join("")}</div>
<b>${t("color")}</b><div class="chips">${p.colors.map(c=>`<button class="chip ${s.color==c?"on":""}" onclick="sel.color='${c}';route()">${c}</button>`).join("")}</div>
<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="addc('${p.id}',false)">${t("add")}</button><button class="btn o" onclick="addc('${p.id}',true)">${t("buy")}</button><button class="btn o" onclick="wa('Hi, I’m interested in ${p.name} (size ${s.size||"?"}, ${s.color}). Is it available?')">${t("enq")}</button></div></div></div>`},
cart(){if(!cart.length)return `<h2>${t("bag")}</h2><p>${t("empty")}</p><a class="btn" href="#shop">${t("shopnow")}</a>`;const sub=cartSub(),d=ship(sub,"home");
return `<h2>${t("bag")}</h2><div class="split"><div>${cart.map((i,n)=>{const p=P.find(x=>x.id==i.id);return `<div class="row"><img src="${p.imgs[0]}" alt=""><div class="g"><b>${esc(p.name)}</b><br><span class="p">${i.size} · ${i.color}</span><br>${money(price(p))}</div><input type="number" min="1" max="${p.stock[i.size]}" value="${i.qty}" style="width:64px;padding:8px" aria-label="Qty" onchange="qty(${n},this.value)"><button class="ib" onclick="cart.splice(${n},1);sv('lmw_cart',cart);badge();route()">${t("remove")}</button></div>`}).join("")}</div>
<div class="note"><p>${t("sub")}: <b>${money(sub)}</b></p><p>${t("del")}: ${d?money(d):"Free"}</p><p>${t("total")}: <b>${money(sub+d)}</b></p><a class="btn" href="#checkout">${t("checkout")}</a></div></div>`},
checkout(){if(!cart.length)return pages.cart();const sub=cartSub();
return `<h2>${t("checkout")}</h2><div class="split"><form class="f" id="cf" onsubmit="return placeOrder(event)" novalidate>
<p><label>${t("name")}<input name="name" autocomplete="name"></label></p><p><label>${t("phone")}<input name="phone" inputmode="numeric" autocomplete="tel" placeholder="10 digits"></label></p><p><label>${t("email")}<input name="email" type="email" autocomplete="email"></label></p>
<p><label><input type="radio" name="mode" value="home" checked onchange="upd()" style="width:auto"> ${t("homed")}</label> <label style="margin-left:16px"><input type="radio" name="mode" value="pickup" onchange="upd()" style="width:auto"> ${t("pick")}</label></p>
<div id="ad"><p><label>${t("addr")}<textarea name="addr" rows="3"></textarea></label></p><p><label>${t("city")}<input name="city"></label></p><p><label>${t("pin")}<input name="pin" inputmode="numeric" maxlength="6"></label></p><p class="ph">Courier or Porter arrangement is confirmed by the store after the order.</p></div>
<div id="pu" hidden class="note">Pickup instructions: <span class="ph">placeholder. Store address and hours to be added by the owner.</span></div>
<div class="note"><b>Online payment is not available yet.</b> UPI will be added later. Cash on delivery is not offered. Your order is saved as “awaiting payment” and the store will confirm next steps.</div>
<div class="err" id="er" role="alert"></div><button class="btn">${t("place")}</button></form>
<div class="note" id="sum"></div></div>`},
wishlist(){const l=P.filter(p=>wish.includes(p.id));return `<h2>${t("wish")}</h2>${l.length?`<div class="grid">${l.map(card).join("")}</div>`:`<p>${t("empty")}</p>`}`},
account(){return `<h2>${t("account")}</h2><div class="note"><b>Login, sign-up, saved addresses and profile need the backend</b>, which is not built yet. Browsing, cart, wishlist and guest checkout work without an account.</div><div class="f" style="max-width:380px"><p><input placeholder="${t("email")} / ${t("phone")}" disabled></p><p><input type="password" placeholder="Password" disabled></p><button class="btn" disabled>${t("login")}</button></div>`},
orders(){return `<h2>${t("orders")}</h2><p class="ph">Saved in this browser only until the backend exists.</p>${orders.length?orders.map(o=>`<div class="row"><div class="g"><b>${o.id}</b> · ${new Date(o.at).toLocaleDateString()}<br>${o.items.map(i=>esc(i)).join(", ")}<br>${t("total")}: ${money(o.total)} · ${o.mode=="pickup"?t("pick"):t("homed")}<br><span class="ph">Status: awaiting payment confirmation (not paid)</span></div></div>`).join(""):`<p>${t("empty")}</p>`}`},
about(){return `<h2>${t("about")}</h2><p class="ph">Placeholder. Brand story to be supplied.</p>`},
contact(){return `<h2>${t("contact")}</h2><p class="ph">Placeholder. Store address, phone and email to be supplied.</p><button class="btn" onclick="wa('Hello LINE MENS WEAR, I need help with an order.')">WhatsApp</button>`},
faq(){return `<h2>${t("faq")}</h2><details open><summary>Can I pay cash on delivery?</summary><p>No. Online (UPI) payment is coming; until then the store confirms payment with you directly.</p></details><details><summary>Can I pick up my order?</summary><p>Yes, choose store pickup at checkout.</p></details>`},
privacy(){return legal("Privacy Policy")},terms(){return legal("Terms and Conditions")},shipping(){return legal("Shipping Policy")},returns(){return legal("Return and Exchange Policy")}};
function legal(h){return `<h2>${h}</h2><div class="note">Placeholder. Real policy text must be written or reviewed by the owner (and a legal adviser) before launch.</div>`}
/* ===== Actions ===== */
function addc(id,go){const p=P.find(x=>x.id==id),s=sel;if(!s.size){toast(t("size")+"?");return}
const e=cart.find(i=>i.id==id&&i.size==s.size&&i.color==s.color);const n=(e?e.qty:0)+1;if(n>p.stock[s.size]){toast(t("out"));return}
if(e)e.qty=n;else cart.push({id,size:s.size,color:s.color,qty:1});sv("lmw_cart",cart);badge();if(go)location.hash="checkout";else toast("✓ "+t("add"))}
function qty(n,v){const i=cart[n],p=P.find(x=>x.id==i.id);i.qty=Math.max(1,Math.min(p.stock[i.size],parseInt(v)||1));sv("lmw_cart",cart);route()}
function upd(){const f=document.getElementById("cf"),m=f.mode.value,sub=cartSub(),d=ship(sub,m);document.getElementById("ad").hidden=m=="pickup";document.getElementById("pu").hidden=m!="pickup";
document.getElementById("sum").innerHTML=`<p>${t("sub")}: ${money(sub)}</p><p>${t("del")}: ${d?money(d):"Free"}</p><p><b>${t("total")}: ${money(sub+d)}</b></p>`}
function placeOrder(e){e.preventDefault();const f=e.target,v=n=>f[n].value.trim(),m=f.mode.value,er=[];
if(v("name").length<2)er.push(t("name"));if(!/^[6-9]\d{9}$/.test(v("phone").replace(/[\s+-]/g,"").replace(/^91/,"")))er.push(t("phone")+" (10-digit Indian mobile)");
if(v("email")&&!/^\S+@\S+\.\S+$/.test(v("email")))er.push(t("email"));
if(m=="home"){if(v("addr").length<8)er.push(t("addr"));if(v("city").length<2)er.push(t("city"));if(!/^\d{6}$/.test(v("pin")))er.push(t("pin")+" (6 digits)")}
document.getElementById("er").textContent=er.length?"Please check: "+er.join(", "):"";if(er.length)return false;
const sub=cartSub(),d=ship(sub,m),items=cart.map(i=>{const p=P.find(x=>x.id==i.id);return `${p.name} ${i.size}/${i.color} x${i.qty}`});
const o={id:"LMW-"+Date.now().toString(36).toUpperCase(),at:Date.now(),items,total:sub+d,mode:m};orders.unshift(o);sv("lmw_orders",orders);
const msg=`New order ${o.id}\n${items.join("\n")}\nTotal ${money(o.total)} (unpaid)\n${v("name")}, ${v("phone")}\n${m=="pickup"?"Store pickup":v("addr")+", "+v("city")+" "+v("pin")}`;
cart=[];sv("lmw_cart",cart);badge();
document.getElementById("app").innerHTML=`<h2>Order ${o.id} received</h2><div class="note">Status: awaiting payment confirmation. Nothing has been charged. ${CONFIG.whatsapp?"":'<span class="ph">WhatsApp number not set yet, so the order is saved in this browser only.</span>'}</div><button class="btn" onclick='wa(${JSON.stringify(msg)})'>Send order on WhatsApp</button> <a class="btn o" href="#orders">${t("orders")}</a>`;return false}
/* ===== Router / chrome ===== */
function chrome(){const L=[["home","home"],["shop","shop"],["new","newa"],["best","best"],["categories","cats"],["about","about"],["contact","contact"],["faq","faq"]];
const h=location.hash.slice(1)||"home";document.getElementById("nav").innerHTML=L.map(([r,k])=>`<a href="#${r}" class="${h==r?"on":""}">${t(k)}</a>`).join("");
document.getElementById("q").placeholder=t("search");document.getElementById("foot").innerHTML=`<div><b>LINE MENS WEAR</b><br>${t("herop")}</div><div><a href="#account">${t("account")}</a><a href="#orders">${t("orders")}</a><a href="#wishlist">${t("wish")}</a></div><div><a href="#privacy">Privacy Policy</a><a href="#terms">Terms and Conditions</a><a href="#shipping">Shipping Policy</a><a href="#returns">Return and Exchange Policy</a></div>`;badge()}
function route(){
 const h=location.hash.slice(1)||"home";let html;
 if(productsLoading){document.getElementById("app").innerHTML='<div class="note">Loading products…</div>';chrome();return}
 if(productsError&&!P.length){document.getElementById("app").innerHTML=`<h2>Products are temporarily unavailable</h2><p>${esc(productsError)}</p><p>Please refresh the page or try again later.</p>`;chrome();return}

if(h.startsWith("product-"))html=pages.product(h.slice(8));else if(h=="new")html=pages.shop("new");else if(h=="best")html=pages.shop("best");else if(h=="shop")html=pages.shop();else if(pages[h])html=pages[h]();else html=`<h2>404</h2><a href="#home">${t("home")}</a>`;
document.getElementById("app").innerHTML=html;chrome();if(h=="checkout"&&cart.length)upd()}
window.addEventListener("hashchange",()=>{window.scrollTo(0,0);route()});
document.getElementById("lang").onchange=e=>{lang=+e.target.value;sv("lmw_lang",lang);document.documentElement.lang=["en","hi","mr","gu","kn"][lang];route()};
document.getElementById("q").onkeydown=e=>{if(e.key=="Enter"){F.q=e.target.value;location.hash=="#shop"?route():location.hash="shop"}};
document.getElementById("wa").onclick=()=>wa("Hello LINE MENS WEAR, I have an enquiry.");
lang=ld("lmw_lang",0);document.getElementById("lang").value=lang;route();loadStoreProducts();
</script></body></html>
